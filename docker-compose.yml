services:
  db:
    image: postgres
    restart: "no"
    shm_size: 128mb
    volumes:
     - type: tmpfs
       target: /dev/shm
       tmpfs:
         size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_DB: cms_odeaanschiedam
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

volumes:
  pg_data:

    
