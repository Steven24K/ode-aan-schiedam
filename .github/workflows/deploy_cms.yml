name: Deploy Ode aan Schiedam + CMS

on:
  push:
    paths:
      - 'cms-750-year-sdam/**'

jobs:
  deploy-cms:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy using ssh
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        port: 22
        script: |
          cd ~/ode-aan-schiedam
          git pull origin main
          cd cms-750-year-sdam
          echo "${{ secrets.ENV_FILE_CMS }}" > .env
          npm install
          npm run build
          pm2 restart strapi