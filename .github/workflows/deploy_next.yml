name: Deploy NextJS

on:
  push:
    paths:
      - 'next-750-year-sdam/**'

jobs:
  deploy-website:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy using SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        port: 22
        script: |
          cd ~/ode-aan-schiedam
          git pull origin main
          cd next-750-year-sdam
          echo "${{ secrets.ENV_FILE_NEXT }}" > .env
          yarn install
          yarn build
          pm2 restart next
  