name: Deploy NextJS
on:
  push:
    branches:
      - main
    paths:
      - next-750-year-sdam/**
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Execute deploy script
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd ode-aan-schiedam
            git pull
            cd next-750-year-sdam

            cat <<'EOF' > .env
            ${{ secrets.NEXTJS_ENV }}
            EOF

            docker compose up --build -d

            rm .env
            
            echo "Done."
